<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#e7dcf5">
    <title>Rat Paradise · Browser Test</title>
    <link rel="stylesheet" href="style.css?v=menu-2">
</head>
<body>
    <main id="game">
        <header id="game-tools">
            <span id="fullscreen-status" role="status"></span>
            <button id="fullscreen" type="button" aria-controls="game">Fullscreen</button>
        </header>
        <div id="game-view">
            <canvas id="unity-canvas" tabindex="0" aria-label="Rat Paradise game"></canvas>
            <section id="launch" class="overlay">
                <div class="card" id="start-card">
                    <div class="menu-brand">
                        <h1>Rat Paradise</h1>
                        <div class="menu-portraits" aria-hidden="true">
                            <img src="menu-rat-friend.png" alt="" class="menu-rat-friend" width="256" height="256">
                            <img src="menu-rat.png" alt="" class="menu-rat" width="256" height="256">
                        </div>
                    </div>
                    <div class="menu-content">
                        <section id="start-menu" aria-label="Start menu" hidden></section>
                        <progress id="progress" value="0" max="1" aria-label="Loading game"></progress>
                        <p id="loading-message" role="status">Loading Rat Paradise…</p>
                        <button id="retry" type="button" hidden>Retry</button>
                    </div>
                </div>
            </section>
            <section id="rotate" class="overlay" hidden>
                <div class="card"><h2>Turn your phone sideways</h2><p>Rat Paradise plays in landscape.</p></div>
            </section>
            <p id="save-error" role="status" hidden></p>
        </div>
    </main>
    <script src="touch.js?v=audit-20261118"></script>
    <script src="start-menu.js?v=menu-2"></script>
    <script src="build-parts.js?v=1"></script>
    <script>
        const game = document.querySelector('#game');
        const canvas = document.querySelector('#unity-canvas');
        const fullscreen = document.querySelector('#fullscreen');
        const fullscreenStatus = document.querySelector('#fullscreen-status');
        const launch = document.querySelector('#launch');
        const retry = document.querySelector('#retry');
        const progress = document.querySelector('#progress');
        const message = document.querySelector('#loading-message');
        const touch = window.RatParadiseWeb.touch;
        const portrait = window.matchMedia('(orientation: portrait)');
        const requestedScale = new URLSearchParams(location.search).get('scale');
        const defaultMobileScale = 1.75;
        const mobileScale = requestedScale === '1.75' || requestedScale === '2' ? Number(requestedScale) : defaultMobileScale;
        const buildRevision = '243d414453aacd96';
        const dataParts = [{"file":"colony-data-5ef370835a0e3dec4eb9d540.bin","size":33554432},{"file":"colony-data-ff38c9c4d0f594b604c57ecc.bin","size":33554432},{"file":"colony-data-cafe565f4fe5b9c57addc5f8.bin","size":33554432},{"file":"colony-data-1e39df91f755f707114d0399.bin","size":13318322}];
        const buildFile = filename => 'Build/' + filename + '?v=' + buildRevision;

        function updateFullscreenButton() {
            fullscreen.textContent = document.fullscreenElement === game ? 'Exit Fullscreen' : 'Fullscreen';
        }

        document.addEventListener('fullscreenchange', updateFullscreenButton);
        fullscreen.addEventListener('click', async () => {
            fullscreenStatus.textContent = '';
            try {
                if (document.fullscreenElement === game) await document.exitFullscreen();
                else await game.requestFullscreen({ navigationUI: 'hide' });
                if (launch.hidden) canvas.focus({ preventScroll: true });
            } catch (error) {
                fullscreenStatus.textContent = 'Fullscreen is unavailable in this tab.';
            }
        });

        function updateOrientation() {
            document.querySelector('#rotate').hidden = !(touch && portrait.matches);
        }
        portrait.addEventListener('change', updateOrientation);
        updateOrientation();

        retry.addEventListener('click', () => location.reload());
        (async function startPlayer() {
            const script = document.createElement('script');
            script.src = buildFile('Release.loader.js');
            const config = {
                dataUrl: buildFile('Release.data.unityweb'),
                frameworkUrl: buildFile('Release.framework.js.unityweb'),
                codeUrl: buildFile('Release.wasm.unityweb'),
                streamingAssetsUrl: 'StreamingAssets',
                companyName: "Rat Paradise Studio",
                productName: "Rat Paradise",
                productVersion: "0.1",
                matchWebGLToCanvasSize: true,
                devicePixelRatio: Math.min(window.devicePixelRatio || 1, touch ? mobileScale : 1.5),
                showBanner: (text, kind) => { if (kind === 'error') message.textContent = text; }
            };
            try {
                await new Promise((resolve, reject) => {
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('Could not load the game files.'));
                    document.body.appendChild(script);
                });
                const restoreFetch = window.installParadiseDataParts(config, dataParts);
                let instance;
                try { instance = await createUnityInstance(canvas, config, value => { progress.value = value; }); }
                finally { restoreFetch(); }
                window.RatParadiseWeb.connectMenu(instance);
            } catch (error) {
                progress.hidden = true;
                message.textContent = String(error);
                retry.hidden = false;
            }
        })();
    </script>
</body>
</html>
